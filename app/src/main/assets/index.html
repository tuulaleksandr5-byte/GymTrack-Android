const techniqueUrls=Object.create(null);
const techniqueLoading=new Set();
let techniqueDatabasePromise=null;
function techniqueDb(){
 if(!('indexedDB' in window))return Promise.reject(new Error('Нет IndexedDB'));
 if(!techniqueDatabasePromise)techniqueDatabasePromise=new Promise((resolve,reject)=>{
  const request=indexedDB.open('gymtrack_technique_files',1);
  request.onupgradeneeded=()=>request.result.createObjectStore('gifs');
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('База недоступна'));
 });
 return techniqueDatabasePromise;
}
async function techniqueLoad(name){
 if(techniqueLoading.has(name)||techniqueUrls[name])return;
 techniqueLoading.add(name);
 try{
  const db=await techniqueDb();
  const blob=await new Promise((resolve,reject)=>{
   const request=db.transaction('gifs','readonly').objectStore('gifs').get(name);
   request.onsuccess=()=>resolve(request.result);
   request.onerror=()=>reject(request.error);
  });
  if(blob instanceof Blob){
   techniqueUrls[name]=URL.createObjectURL(blob);
   if(currentPage==='technique'&&selectedTechnique===name)render();
  }
 }catch(e){console.warn('Не удалось прочитать GIF',e);}
}
async function techniqueUpload(file){
 if(!file)return;
 if(file.type!=='image/gif'&&!/\.gif$/i.test(file.name)){toast('Нужен анимированный файл GIF');return;}
 if(file.size>15*1024*1024){toast('GIF должен быть меньше 15 МБ');return;}
 try{
  const db=await techniqueDb();
  await new Promise((resolve,reject)=>{
   const transaction=db.transaction('gifs','readwrite');
   transaction.objectStore('gifs').put(file,selectedTechnique);
   transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);
  });
  if(techniqueUrls[selectedTechnique])URL.revokeObjectURL(techniqueUrls[selectedTechnique]);
  techniqueUrls[selectedTechnique]=URL.createObjectURL(file);
  render();
  toast('Анимация сохранена для этого упражнения',true);
 }catch(e){toast('Не удалось сохранить GIF на устройстве');}
}

function makeSession(id){const p=programme(id);return{id:uid(),programId:p.id,name:p.title,date:TODAY(),startedAt:Date.now(),exercises:p.exercises.map(e=>({id:uid(),name:e[0],sets:Array.from({length:e[1]},()=>({id:uid(),reps:e[2],weight:0,done:false}))}))};}
function startWorkout(id){if(data.active){if(!confirm('Сейчас уже идёт тренировка. Завершить её без сохранения и начать новую?')){navigate('workout');return;}data.active=null;}data.active=makeSession(id);data.defaultProgram=id;persist();navigate('workout');toast('Тренировка началась!',true);}
function renderWorkout(){if(!data.active)return `<div class="workout-empty"><div class="empty-icon">${icon('dumbbell',38)}</div><h2>Готов к тренировке?</h2><p>Выбери программу, отмечай завершённые подходы и запускай таймер отдыха. Записи сохранятся в историю, когда закончишь занятие.</p><div class="quick-cards">${allPrograms().map(p=>`<button class="quick-card" data-action="start" data-id="${p.id}">${icon(p.icon,25)}${p.title}</button>`).join('')}</div></div>`;
const s=data.active,done=countCompletedSets(s),total=countTotalSets(s);return `<div class="workout-layout"><div class="workout-main"><section class="session-top"><div class="session-topline"><span class="live-indicator"><span class="live-dot"></span> ТРЕНИРОВКА ИДЁТ</span><button class="btn btn-subtle btn-sm" data-action="finish">${icon('check',15)} Завершить</button></div><h2>${escapeHTML(s.name)}</h2><p>Отмечай выполненные подходы. Вес в кг, повторения — в шт. Для упражнений на время используй секунды.</p><div class="progress-track"><div style="width:${total?Math.round(done/total*100):0}%"></div></div><div class="session-count"><span>Прогресс занятия</span><span>${done} / ${total} подходов</span></div></section>
${s.exercises.map((e,exIndex)=>`<section class="exercise-card"><div class="exercise-card-header"><div class="exercise-title"><span class="exercise-index">${pad(exIndex+1)}</span><span><h3>${escapeHTML(e.name)}</h3><small>${e.sets.filter(v=>v.done).length} из ${e.sets.length} выполнено</small></span></div><button class="btn btn-subtle btn-sm" data-action="technique-open" data-id="${escapeHTML(e.name)}" aria-label="Посмотреть технику упражнения ${escapeHTML(e.name)}">${icon('play',14)} Техника</button><button class="btn btn-icon btn-subtle btn-sm" data-action="remove-exercise" data-eid="${e.id}" aria-label="Удалить упражнение" title="Убрать упражнение">${icon('x',14)}</button></div><div class="exercise-meta"><span>Сет</span><span>${e.name.includes('(сек)')?'Секунды':'Повторы'}</span><span>Вес (кг)</span><span>Готово</span></div>${e.sets.map((set,ix)=>`<div class="set-row ${set.done?'done':''}"><span class="set-number">${ix+1}</span><input class="set-input" type="number" min="0" max="999" step="1" inputmode="numeric" aria-label="Повторения: ${escapeHTML(e.name)}, подход ${ix+1}" data-set-field="reps" data-eid="${e.id}" data-sid="${set.id}" value="${Number(set.reps)||0}"/><input class="set-input" type="number" min="0" max="9999" step="0.5" inputmode="decimal" aria-label="Вес: ${escapeHTML(e.name)}, подход ${ix+1}" data-set-field="weight" data-eid="${e.id}" data-sid="${set.id}" value="${Number(set.weight)||0}"/><button class="set-check ${set.done?'checked':''}" data-action="toggle-set" data-eid="${e.id}" data-sid="${set.id}" aria-label="${set.done?'Снять отметку':'Отметить подход'}" aria-pressed="${set.done}">${icon('check',19)}</button></div>`).join('')}<button class="add-set" data-action="add-set" data-eid="${e.id}">${icon('plus',15)} Добавить подход</button></section>`).join('')}
<div class="add-exercise"><input class="custom-input" id="customExercise" maxlength="60" placeholder="Название своего упражнения" aria-label="Название своего упражнения"/><button class="btn btn-subtle" data-action="add-exercise">${icon('plus',16)} Добавить</button></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px"><button class="btn btn-primary" data-action="finish">${icon('check',17)} Завершить и сохранить</button><button class="btn btn-danger" data-action="discard">${icon('x',15)} Отменить занятие</button></div></div><aside class="side-stack">${renderTimer()}<div class="tip-card"><div class="tip-card-head">${icon('info',16)} Советы по тренировке</div><p>Записывай комфортное число повторений и подходов. Перед новым упражнением проверь технику и отдыхай столько, сколько нужно.</p></div></aside></div>`;}
function setById(eid,sid){const e=data.active?.exercises.find(x=>x.id===eid);return e?.sets.find(s=>s.id===sid);}
function updateSet(eid,sid,field,val){const s=setById(eid,sid);if(!s)return;let n=Number(val);if(!Number.isFinite(n)||n<0)n=0;n=Math.min(9999,n);s[field]=field==='reps'?Math.round(n):Math.round(n*2)/2;persist();}
function toggleSet(eid,sid){const s=setById(eid,sid);if(!s)return;s.done=!s.done;persist();render();if(s.done)toast('Подход отмечен',true);}
function addSet(eid){const e=data.active?.exercises.find(x=>x.id===eid);if(!e)return;const prev=e.sets.at(-1)||{reps:10,weight:0};e.sets.push({id:uid(),reps:prev.reps,weight:prev.weight,done:false});persist();render();}
function addExercise(){const inp=document.getElementById('customExercise'),value=inp?.value.trim();if(!value){toast('Напиши название упражнения');inp?.focus();return;}if(!data.active)return;data.active.exercises.push({id:uid(),name:value,sets:[{id:uid(),reps:10,weight:0,done:false}]});persist();render();toast('Упражнение добавлено',true);}
function finishModal(){const s=data.active;if(!s)return;const done=countCompletedSets(s);if(!done){toast('Сначала отметь хотя бы один выполненный подход');return;}const seconds=Math.max(60,Math.floor((Date.now()-s.startedAt)/1000));modal(`<div class="modal-top"><div class="modal-title">Завершить тренировку?</div><button class="btn btn-subtle btn-icon" data-action="close-modal" aria-label="Закрыть">${icon('x',16)}</button></div><p class="modal-desc">Все отмеченные подходы будут сохранены в истории, а сегодняшняя дата появится в календаре.</p><div class="modal-summary"><div><strong>${done}</strong><span>выполнено подходов</span></div><div><strong>${durationLabel(seconds)}</strong><span>продолжительность</span></div></div><div class="modal-actions"><button class="btn btn-subtle" data-action="close-modal">Продолжить</button><button class="btn btn-primary" data-action="save-workout">${icon('check',16)} Сохранить</button></div>`);}
function saveWorkout(){const s=data.active;if(!s)return;const completedSets=countCompletedSets(s);if(!completedSets)return;const duration=Math.max(60,Math.floor((Date.now()-s.startedAt)/1000));data.sessions.unshift({id:s.id,date:TODAY(),name:s.name,programId:s.programId,duration,completedSets,exercises:structuredClone(s.exercises)});data.plans=data.plans.filter(p=>!(p.date===TODAY()&&p.programId===s.programId));data.active=null;restRunning=false;restDeadline=null;persist();closeModal();navigate('history');toast('Тренировка сохранена!',true);}
function discardWorkout(){if(confirm('Удалить текущую тренировку без сохранения?')){data.active=null;restRunning=false;restDeadline=null;persist();navigate('programs');toast('Тренировка отменена');}}
function removeExercise(eid){if(!data.active)return;data.active.exercises=data.active.exercises.filter(e=>e.id!==eid);persist();render();}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;}
function closeModal(){document.getElementById('modalRoot').innerHTML='';}
function renderTimer(){const pct=Math.max(0,Math.min(100,100*(restDuration-restRemaining)/restDuration));return `<section class="timer-card" id="timerCard"><div class="timer-header"><strong>${icon('clock',17)} Таймер отдыха</strong><span class="timer-sub">МЕЖДУ ПОДХОДАМИ</span></div><div class="timer-ring" id="timerRing" style="--pct:${pct}%"><div class="timer-inner"><div class="timer-digits" id="timerDigits">${formattedTime(restRemaining)}</div><small id="timerStatus">${restRunning?'ОСТАЛОСЬ':'ГОТОВ К СТАРТУ'}</small></div></div><div class="timer-presets">${[45,60,90,120].map(n=>`<button class="${restDuration===n?'active':''}" data-action="timer-preset" data-id="${n}">${n} с</button>`).join('')}</div><div class="timer-actions"><button class="btn btn-primary" data-action="timer-toggle">${icon(restRunning?'pause':'play',16)} ${restRunning?'Пауза':'Старт'}</button><button class="btn btn-subtle" data-action="timer-reset" title="Сбросить таймер">${icon('rotate',17)} Сброс</button></div></section>`;}
function refreshTimerUI(){updateTopTimer();const digits=document.getElementById('timerDigits'),ring=document.getElementById('timerRing'),status=document.getElementById('timerStatus');if(digits)digits.textContent=formattedTime(restRemaining);if(ring)ring.style.setProperty('--pct',`${Math.max(0,Math.min(100,100*(restDuration-restRemaining)/restDuration))}%`);if(status)status.textContent=restRunning?'ОСТАЛОСЬ':restRemaining===0?'ГОТОВО':'ГОТОВ К СТАРТУ';}
function timerPreset(n){restRunning=false;restDeadline=null;restDuration=n;restRemaining=n;if(currentPage==='workout')render();else refreshTimerUI();}
function timerToggle(){if(restRunning){restRemaining=Math.max(0,Math.ceil((restDeadline-Date.now())/1000));restDeadline=null;restRunning=false;}else{if(restRemaining<=0)restRemaining=restDuration;restRunning=true;restDeadline=Date.now()+restRemaining*1000;}if(currentPage==='workout')render();else refreshTimerUI();}
function timerReset(){restRunning=false;restDeadline=null;restRemaining=restDuration;if(currentPage==='workout')render();else refreshTimerUI();}
function timerSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=660;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.11,ctx.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.25);osc.connect(gain).connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.27);osc.onended=()=>ctx.close();}catch(e){/* browsers may block audio */}}
setInterval(()=>{if(!restRunning)return;const next=Math.max(0,Math.ceil((restDeadline-Date.now())/1000));if(next!==restRemaining){restRemaining=next;refreshTimerUI();}if(next===0){restRunning=false;restDeadline=null;refreshTimerUI();if(currentPage==='workout')render();timerSound();toast('Отдых завершён — продолжай, когда будешь готов!',true);}},250);

function showCalendarFor(id){selectedDate=TODAY();calendarMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1);selectedPlanProgram=id;navigate('calendar');toast('Выбери дату и нажми «Добавить в план»');}

function renderCalendar(){const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7,count=new Date(y,m+1,0).getDate(),cells=Math.ceil((offset+count)/7)*7,days=Array.from({length:cells},(_,i)=>{const day=i-offset+1;return day>=1&&day<=count?new Date(y,m,day):null;}),dailyPlans=data.plans.filter(p=>p.date===selectedDate),dailySessions=data.sessions.filter(s=>s.date===selectedDate);
return `<div class="content-intro"><h2>Планируй в удобном темпе.</h2><p>Отмечай будущие тренировки и смотри, какие занятия уже сохранились в истории.</p></div><div class="calendar-layout"><section class="calendar-pane"><div class="calendar-toolbar"><h3>${first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h3><div class="calendar-tools"><button data-action="month-prev" aria-label="Предыдущий месяц">${icon('chevronLeft',19)}</button><button data-action="month-next" aria-label="Следующий месяц">${icon('chevronRight',19)}</button></div></div><div class="cal-weeknames">${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${days.map(d=>{if(!d)return `<div class="cal-day outside" aria-hidden="true"></div>`;const date=isoLocal(d),hasPlan=data.plans.some(p=>p.date===date),hasDone=data.sessions.some(s=>s.date===date);return `<button class="cal-day ${date===TODAY()?'today':''} ${date===selectedDate?'selected':''}" data-action="select-date" data-id="${date}" aria-label="${formattedDate(date,{day:'numeric',month:'long',year:'numeric'})}${hasDone?', есть занятие':''}${hasPlan?', есть план':''}" ${date===selectedDate?'aria-pressed="true"':''}><span class="cal-day-number">${d.getDate()}</span><span class="cal-dots">${hasDone?'<span class="cal-dot complete"></span>':''}${hasPlan?'<span class="cal-dot"></span>':''}</span></button>`;}).join('')}</div><div class="legend"><span><i class="cal-dot" style="display:inline-block"></i> Запланировано</span><span><i class="cal-dot complete" style="display:inline-block"></i> Выполнено</span></div></section><aside class="panel day-details"><div class="detail-label">ВЫБРАННЫЙ ДЕНЬ</div><h3>${formattedDate(selectedDate,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h3><div class="detail-label">ТРЕНИРОВКИ ЗА ДЕНЬ</div>${dailySessions.map(s=>`<div class="detail-entry">${icon('check',20)}<div><strong>${escapeHTML(s.name)}</strong><small>Завершено · ${s.completedSets} подходов</small></div></div>`).join('')}${dailyPlans.map(p=>`<div class="detail-entry">${icon('calendar',19)}<div style="flex:1"><strong>${escapeHTML(programme(p.programId).title)}</strong><small>Запланировано</small></div><button class="btn btn-icon btn-subtle btn-sm" title="Удалить план" aria-label="Удалить план" data-action="remove-plan" data-id="${p.id}">${icon('x',14)}</button></div>`).join('')}${!dailyPlans.length&&!dailySessions.length?'<div class="empty-mini"><p>На этот день пока ничего не записано.</p></div>':''}<label class="select-label" for="planProgram">ДОБАВИТЬ ТРЕНИРОВКУ</label><select id="planProgram" class="form-select">${allPrograms().map(p=>`<option value="${p.id}" ${p.id===selectedPlanProgram?'selected':''}>${p.title}</option>`).join('')}</select><div class="spacer-16"></div><button class="btn btn-primary full-width" data-action="schedule">${icon('calendarPlus',16)} Добавить в план</button></aside></div>`;}
function completedWeeks(){const first=getWeekMonday(new Date());return Array.from({length:8},(_,i)=>{const start=addDays(first,(i-7)*7),end=addDays(start,7),value=data.sessions.filter(s=>{const d=fromISO(s.date);return d>=start&&d<end;}).length;return{label:start.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}),value};});}
function renderHistory(){const weeks=completedWeeks(),peak=Math.max(3,...weeks.map(x=>x.value));return `<div class="content-intro"><h2>История, которую создаёшь ты.</h2><p>Здесь сохраняются твои тренировки и выполненные подходы. Данные видны только в этом браузере.</p></div><div class="history-layout"><section class="panel">${sectionHead('Тренировки по неделям','Количество сохранённых занятий за 8 недель')}<div class="history-chart" aria-label="График тренировок по неделям">${weeks.map(w=>`<div class="chart-col"><span class="chart-num">${w.value}</span><div class="chart-bar-holder"><div class="chart-bar" style="height:${w.value/peak*100}%"></div></div><span class="chart-label">${w.label}</span></div>`).join('')}</div></section><section class="panel">${sectionHead('Твои результаты','Общая статистика')}<div class="stats-grid" style="grid-template-columns:repeat(2,1fr);margin:22px 0 0"><div class="stat-card"><span class="stat-label">Тренировки</span><div><span class="stat-number">${data.sessions.length}</span></div></div><div class="stat-card"><span class="stat-label">Подходы</span><div><span class="stat-number">${totalSets()}</span></div></div><div class="stat-card"><span class="stat-label">Всего времени</span><div><span class="stat-number">${Math.round(totalDuration()/60)}</span><span class="stat-unit">мин</span></div></div><div class="stat-card"><span class="stat-label">Дней с занятиями</span><div><span class="stat-number">${new Set(data.sessions.map(x=>x.date)).size}</span></div></div></div></section></div><div class="spacer-16"></div>${sectionHead('Журнал тренировок',`${data.sessions.length} сохранённых занятий`)}<div class="history-list">${data.sessions.length?data.sessions.map(s=>`<article class="session-card"><span class="session-symbol">${icon('dumbbell',22)}</span><div class="session-card-body"><h3>${escapeHTML(s.name)}</h3><p>${s.completedSets||0} подходов · ${durationLabel(s.duration)}</p></div><span class="session-date">${formattedDate(s.date)}</span><button class="btn btn-subtle btn-icon" data-action="session-details" data-id="${s.id}" title="Подробнее" aria-label="Подробнее о тренировке">${icon('chevronRight',18)}</button></article>`).join(''):`<div class="panel empty-panel">${icon('history',33)}<h3>История пока пустая</h3><p>Начни тренировку и сохрани хотя бы один подход — здесь появится первая запись.</p><button class="btn btn-primary" data-nav="programs">Выбрать программу ${icon('arrowRight',16)}</button></div>`}</div>`;}
function showSessionDetails(id){const s=data.sessions.find(x=>x.id===id);if(!s)return;modal(`<div class="modal-top"><div class="modal-title">${escapeHTML(s.name)}</div><button class="btn btn-icon btn-subtle" data-action="close-modal" aria-label="Закрыть">${icon('x',16)}</button></div><p class="modal-desc">${formattedDate(s.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${durationLabel(s.duration)}</p><div class="modal-summary"><div><strong>${s.completedSets||0}</strong><span>подходов</span></div><div><strong>${s.exercises?.length||0}</strong><span>упражнений</span></div></div><div style="max-height:260px;overflow:auto">${(s.exercises||[]).map(e=>{const sets=(e.sets||[]).filter(x=>x.done);if(!sets.length)return '';return `<div class="detail-entry">${icon('check',18)}<div><strong>${escapeHTML(e.name)}</strong><small>${sets.map(x=>`${Number(x.reps)||0} повт. · ${Number(x.weight)||0} кг`).join(' / ')}</small></div></div>`;}).join('')}</div><div class="modal-actions"><button class="btn btn-subtle" data-action="close-modal">Закрыть</button><button class="btn btn-danger" data-action="delete-session" data-id="${s.id}">${icon('trash',15)} Удалить запись</button></div>`);}

function updateNativeMusicStatus(redraw=true){
 if(!IS_ANDROID_MUSIC)return;
 try {
  const s=JSON.parse(window.GymTrackAndroid.getNativeState());
  const nextIndex=Math.max(0,Number(s.index)||0), nextPlaying=!!s.playing;
  const change=nextIndex!==nativeIndex||nextPlaying!==nativePlaying;
  nativeIndex=nextIndex;nativePlaying=nextPlaying;
  if(change&&redraw&&currentPage==='music')render();
 }catch(e){}
}
window.gymtrackReceiveTracks=function(items){
 nativeTracks=Array.isArray(items)?items:[];nativeIndex=0;nativePlaying=false;
 if(currentPage==='music')render();
};
function nativeMusicCommand(cmd,index=nativeIndex){
 if(!IS_ANDROID_MUSIC||!nativeTracks.length){toast('Сначала добавь аудиофайлы');return;}
 try{
  window.GymTrackAndroid.nativeMusicCommand(cmd,Number(index));
  nativeIndex=(cmd==='track')?Number(index):nativeIndex;
  if(cmd==='track')nativePlaying=true;
  if(cmd==='toggle')nativePlaying=!nativePlaying;
  if(cmd==='next')nativeIndex=(nativeIndex+1)%nativeTracks.length;
  if(cmd==='previous')nativeIndex=(nativeIndex+nativeTracks.length-1)%nativeTracks.length;
  if(currentPage==='music')render();
 }catch(e){toast('Не удалось запустить музыку');}
}
function playlistProvider(value){
 let u;
 try{u=new URL(value.trim());}catch(e){return null;}
 if(u.protocol!=='https:'||u.username||u.password||value.length>1000)return null;
 if(u.hostname==='open.spotify.com'&&/^\/playlist\/[a-zA-Z0-9]+\/?$/.test(u.pathname))
   return {provider:'Spotify',url:u.href};
 if(['www.youtube.com','youtube.com','music.youtube.com'].includes(u.hostname)
    &&['/playlist','/watch'].includes(u.pathname)&&/^[A-Za-z0-9_-]{8,}$/.test(u.searchParams.get('list')||''))
   return {provider:'YouTube',url:u.href};
 return null;
}

async function findYouTubeTrackOnSoundCloud(){
  const q=soundCloudQueryFromInput();
  if(!q){toast('Вставь ссылку YouTube или напиши название песни');return;}
  if(!isYouTubeMusicLink(q)){openSoundCloudSearch(q);return;}
  if(!window.GymTrackDesktop?.getYouTubeTitle){
    toast('Для ссылки YouTube используй ПК-версию; здесь введи название песни');
    return;
  }
  const status=document.getElementById('soundCloudSearchStatus');
  const button=document.querySelector('[data-action="soundcloud-search"]');
  if(status)status.textContent='Получаю название видео YouTube…';
  if(button)button.disabled=true;
  try {
    const response=await window.GymTrackDesktop.getYouTubeTitle(q);
    if(response?.title){
      const title=String(response.title).trim().slice(0,220);
      const input=document.getElementById('soundCloudQuery');
      if(input)input.value=title;
      if(status)status.textContent='Найдено название: '+title+'. Открываю поиск SoundCloud…';

      if(status)status.textContent='Название не удалось получить. Введи его вручную.';
      toast('YouTube не вернул название видео');

    if(button)button.disabled=false;
  }
}

async function soundCloudConnect(){
 const id=document.getElementById('scClientId')?.value.trim()||'';
 const secret=document.getElementById('scClientSecret')?.value.trim()||'';
 if(!id||!secret){toast('Заполни Client ID и Client Secret');return;}
 soundCloudState.loading=true;soundCloudState.message='Проверяем доступ…';render();
 try{
  const res=await window.GymTrackDesktop.soundCloudConnect(id,secret);
  soundCloudState.connected=!!res.connected;
  soundCloudState.message=res.error||'SoundCloud API подключён';
  soundCloudState.results=[];
 }catch(e){soundCloudState.message='Не удалось подключить SoundCloud';}
 finally{soundCloudState.loading=false;render();}
}
async function soundCloudDisconnect(){
 if(!confirm('Отключить API SoundCloud и удалить локально сохранённые ключи?'))return;
 try{await window.GymTrackDesktop.soundCloudDisconnect();}catch{}
 soundCloudState.connected=false;soundCloudState.results=[];soundCloudState.query='';
 soundCloudState.message='API отключён';render();
}
async function soundCloudSearch(qOverride){
 const query=(qOverride||document.getElementById('scSearchTerm')?.value||'').trim();
 const kind=qOverride?'tracks':document.getElementById('scSearchKind')?.value||'tracks';
 if(query.length<2||query.length>160){toast('Напиши от 2 до 160 символов');return;}
 soundCloudState.loading=true;soundCloudState.message='';soundCloudState.query=query;soundCloudState.kind=kind;render();
 try{
  const res=await window.GymTrackDesktop.soundCloudSearch(kind,query);
  soundCloudState.results=Array.isArray(res.results)?res.results:[];
  soundCloudState.message=res.error||'';
 }catch(e){soundCloudState.message='Ошибка API SoundCloud';soundCloudState.results=[];}
 finally{soundCloudState.loading=false;render();}
}
async function soundCloudPlay(index){
 const result=soundCloudState.results[index];if(!result)return;
 try{
  const out=await window.GymTrackDesktop.soundCloudPlay(result.url);
  if(out?.error)toast(out.error);
 }catch(e){toast('Не удалось открыть плеер SoundCloud');}
}

function renderMusic(){if(IS_ANDROID_MUSIC)return renderNativeMusic();const track=music.tracks[music.index];return `<div class="content-intro"><h2>Тренируйся под свой плейлист.</h2><p>Загружай свои аудиофайлы с устройства и управляй воспроизведением прямо на сайте.</p></div><div class="music-layout"><section class="player-card"><div class="album-art" aria-hidden="true">${icon('headphones',86)}</div><div class="now-playing-label">СЕЙЧАС ИГРАЕТ</div><h2 class="track-title" data-audio-title>${track?escapeHTML(track.name):'Твой плейлист'}</h2><div class="track-subtitle" data-audio-subtitle>${track?'Локальный аудиофайл':'Добавь музыку для начала'}</div><input class="music-progress" type="range" id="musicSeek" min="0" max="100" value="0" aria-label="Позиция воспроизведения"/><div class="player-timestamps"><span id="musicTime">00:00</span><span id="musicDuration">00:00</span></div><div class="player-controls"><button class="player-plain" data-action="track-prev" aria-label="Предыдущая песня">${icon('skipBack',25)}</button><button class="player-main" data-action="music-toggle" aria-label="${music.playing?'Пауза':'Воспроизвести'}" id="musicMainControl">${icon(music.playing?'pause':'play',28)}</button><button class="player-plain" data-action="track-next" aria-label="Следующая песня">${icon('skipForward',25)}</button></div><div class="volume-row">${icon('volume',18)}<input type="range" min="0" max="100" id="musicVolume" value="${Math.round(music.audio.volume*100)}" aria-label="Громкость"/></div></section><section class="track-panel"><div class="section-head"><div><h2 class="section-title">Моя музыка</h2><div class="section-kicker">Аудио только с твоего устройства</div></div><span class="data-count">${music.tracks.length} треков</span></div><label class="upload-box" id="uploadBox" for="musicFiles" style="display:block">${icon('upload',27)}<h3>Добавить аудиофайлы</h3><p>Нажми здесь или перетащи файлы<br/>MP3, WAV, M4A и другие поддерживаемые форматы</p></label><input id="musicFiles" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" multiple hidden/><div class="track-list" id="musicTracks">${music.tracks.length?music.tracks.map((t,i)=>`<button class="track-item ${music.index===i?'active':''}" data-action="select-track" data-id="${i}">${icon(music.index===i&&music.playing?'pause':'music',19)}<span class="track-name"><strong>${escapeHTML(t.name)}</strong><small>${escapeHTML(t.fileType||'Аудиофайл')}</small></span>${music.index===i?icon('check',15):''}</button>`).join(''):'<div class="empty-mini"><p>Треков пока нет. Добавь свои аудиофайлы, чтобы включить музыку.</p></div>'}</div><div class="track-help">${icon('info',14)} Аудиофайлы не отправляются на сервер. После перезагрузки страницы их нужно выбрать снова; сохранённые тренировки останутся.<div class="music-links"><a href="https://music.youtube.com/" target="_blank" rel="noopener noreferrer">YouTube Music ${icon('external',12)}</a><a href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">Spotify ${icon('external',12)}</a></div></div></section></div>${soundCloudSearchSection()}${playlistLinksSection()}`;}
function addMusicFiles(files){const valid=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(f.name));if(!valid.length){toast('Выбери поддерживаемые аудиофайлы');return;}for(const f of valid.slice(0,50)){music.tracks.push({name:f.name.replace(/\.[^.]+$/,'').slice(0,140),url:URL.createObjectURL(f),fileType:f.type||'Аудиофайл'});}if(music.index===-1)selectTrack(0,false);render();toast(`Добавлено треков: ${Math.min(50,valid.length)}`,true);}
function selectTrack(index,autoplay=true){if(index<0||index>=music.tracks.length)return;music.index=index;music.audio.src=music.tracks[index].url;music.audio.load();if(autoplay){music.audio.play().catch(()=>toast('Нажми Play, чтобы запустить музыку'));}if(currentPage==='music')render();}
function toggleMusic(){if(music.index<0){toast('Сначала добавь аудиофайлы');return;}if(music.audio.paused){music.audio.play().catch(()=>toast('Не удалось запустить этот аудиофайл'));}else music.audio.pause();}
function changeTrack(direction){if(!music.tracks.length){toast('Добавь музыку, чтобы переключать треки');return;}selectTrack((music.index+direction+music.tracks.length)%music.tracks.length,true);}
function updateAudioUI(){if(currentPage!=='music')return;const track=music.tracks[music.index],title=document.querySelector('[data-audio-title]'),subtitle=document.querySelector('[data-audio-subtitle]'),seek=document.getElementById('musicSeek'),time=document.getElementById('musicTime'),dur=document.getElementById('musicDuration'),control=document.getElementById('musicMainControl');if(title)title.textContent=track?.name||'Твой плейлист';if(subtitle)subtitle.textContent=track?'Локальный аудиофайл':'Добавь музыку для начала';const length=music.audio.duration||0,at=music.audio.currentTime||0;if(seek)seek.value=length?Math.min(100,100*at/length):0;if(time)time.textContent=formattedTime(at);if(dur)dur.textContent=formattedTime(length);if(control){control.innerHTML=icon(music.playing?'pause':'play',28);control.setAttribute('aria-label',music.playing?'Пауза':'Воспроизвести');}}
music.audio.addEventListener('play',()=>{music.playing=true;updateAudioUI();});music.audio.addEventListener('pause',()=>{music.playing=false;updateAudioUI();});music.audio.addEventListener('timeupdate',updateAudioUI);music.audio.addEventListener('loadedmetadata',updateAudioUI);music.audio.addEventListener('ended',()=>{if(music.tracks.length>1)changeTrack(1);else{music.playing=false;updateAudioUI();}});music.audio.addEventListener('error',()=>{if(music.index>=0)toast('Не удалось воспроизвести файл в этом браузере');});
function renderSettings(){return `<div class="content-intro"><h2>Твои данные под контролем.</h2><p>Записи не загружаются на сервер. Можно сохранить резервную копию или перенести историю в другой браузер.</p></div><div class="settings-layout"><section class="settings-card"><div class="stat-icon" style="margin-bottom:19px">${icon('download',20)}</div><h3>Скачать мои данные</h3><p>Экспорт тренировок, подходов и календаря в один JSON-файл для резервного копирования.</p><button class="btn btn-primary" data-action="export">${icon('download',16)} Скачать JSON</button></section><section class="settings-card"><div class="stat-icon" style="margin-bottom:19px">${icon('upload',20)}</div><h3>Восстановить из файла</h3><p>Загрузи ранее сохранённый JSON. Текущие данные будут заменены после подтверждения.</p><label class="btn btn-subtle clickable" for="importData">${icon('upload',16)} Выбрать JSON</label><input type="file" id="importData" accept=".json,application/json" hidden/></section><section class="settings-card"><div class="stat-icon" style="margin-bottom:19px">${icon('trash',20)}</div><h3>Удалить все записи</h3><p>Очистит историю, планы и текущую тренировку. Это действие нельзя отменить, если нет резервной копии.</p><button class="btn btn-danger" data-action="clear">${icon('trash',15)} Очистить данные</button></section><section class="settings-card"><div class="stat-icon" style="margin-bottom:19px">${icon('info',20)}</div><h3>О сайте GymTrack</h3><p>Рабочий прототип фитнес-дневника с программами тренировок, подходами, календарём, таймером и локальным плеером.</p><div class="notice">Версия 1.0 · Оффлайн-записи в браузере · Музыка хранится только на устройстве</div></section></div>`;}
function exportData(){
  const json=JSON.stringify({format:'gymtrack-v1',savedAt:new Date().toISOString(),...data},null,2),name='gymtrack-backup-'+TODAY()+'.json';
  if(window.GymTrackAndroid&&typeof window.GymTrackAndroid.saveJson==='function'){
    window.GymTrackAndroid.saveJson(json,name);
    toast('Выбери место для сохранения',true);return;
  }
  const blob=new Blob([json],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Копия создана',true);
}
async function importData(file){if(!file)return;try{if(file.size>5e6)throw Error('Слишком большой файл');const obj=JSON.parse(await file.text());if(!Array.isArray(obj.sessions)||!Array.isArray(obj.plans))throw Error('Неверный формат');if(obj.sessions.length>10000||obj.plans.length>10000)throw Error('Слишком много записей');if(obj.sessions.some(s=>!s||typeof s.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s.date)||!Array.isArray(s.exercises)||s.exercises.some(e=>!e||!Array.isArray(e.sets))))throw Error('Неверный формат истории');const importedCustom=cleanCustomPrograms(obj.customPrograms);const importedPrograms=PROGRAMS.concat(importedCustom);if(Array.isArray(obj.customPrograms)&&importedCustom.length!==obj.customPrograms.length)throw Error('Неверный формат своих программ');if(obj.plans.some(p=>!p||typeof p.date!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(p.date)||!importedPrograms.some(pr=>pr.id===p.programId)))throw Error('Неверный формат планов');if(!confirm('Заменить все текущие записи данными из этого файла?'))return;data={sessions:obj.sessions,plans:obj.plans,active:obj.active&&Array.isArray(obj.active.exercises)?obj.active:null,customPrograms:importedCustom,defaultProgram:importedPrograms.some(p=>p.id===obj.defaultProgram)?obj.defaultProgram:'full'};persist();navigate('home');toast('Данные восстановлены',true);}catch(e){toast('Не удалось прочитать JSON: '+e.message);}}
function clearData(){if(!confirm('Точно удалить ВСЕ тренировки, календарь и историю? Это нельзя отменить.'))return;data=emptyData();restRunning=false;restDeadline=null;restRemaining=restDuration;persist();navigate('home');toast('Все записи очищены');}

// Events are delegated so navigation works after re-rendering every view.
document.addEventListener('click',event=>{const target=event.target.closest('[data-nav], [data-action]');if(!target)return;if(target.dataset.nav){navigate(target.dataset.nav);return;}const action=target.dataset.action,id=target.dataset.id,eid=target.dataset.eid,sid=target.dataset.sid;
switch(action){
case 'technique-open':selectedTechnique=TECHNIQUE_EXERCISES.includes(id)?id:TECHNIQUE_EXERCISES[0];navigate('technique');break;
case 'technique-select':selectedTechnique=id;render();break;
case 'custom-new':openCustomEditor();break;
case 'custom-edit':openCustomEditor(id);break;
case 'custom-delete':deleteCustomProgram(id);break;
case 'custom-cancel':programEditorDraft=null;render();break;
case 'custom-add-exercise':if(programEditorDraft){if(programEditorDraft.exercises.length>=30){toast('Максимум 30 упражнений');break;}programEditorDraft.exercises.push({key:uid(),name:'',sets:3,reps:10});render();}break;
case 'custom-remove-exercise':if(programEditorDraft){programEditorDraft.exercises.splice(Number(id),1);render();}break;
case 'custom-up':moveProgramExercise(Number(id),-1);break;
case 'custom-down':moveProgramExercise(Number(id),1);break;
case 'custom-save':saveCustomProgram();break;
case 'start':startWorkout(id);break;case 'continue':navigate('workout');break;case 'plan-program':showCalendarFor(id);break;
case 'toggle-set':toggleSet(eid,sid);break;case 'add-set':addSet(eid);break;case 'add-exercise':addExercise();break;case 'remove-exercise':removeExercise(eid);break;
case 'finish':finishModal();break;case 'save-workout':saveWorkout();break;case 'discard':discardWorkout();break;
case 'timer-preset':timerPreset(Number(id));break;case 'timer-toggle':timerToggle();break;case 'timer-reset':timerReset();break;
case 'month-prev':calendarChangeMonth(-1);break;case 'month-next':calendarChangeMonth(1);break;case 'select-date':selectCalendarDate(id);break;case 'schedule':scheduleWorkout();break;case 'remove-plan':removePlan(id);break;
case 'session-details':showSessionDetails(id);break;case 'delete-session':deleteSession(id);break;
case 'soundcloud-search':findYouTubeTrackOnSoundCloud();break;
case 'youtube-to-soundcloud':youtubeToSoundCloudSearch();break;
case 'youtube-open-soundcloud':openYoutubeSoundCloud();break;
case 'sc-connect':soundCloudConnect();break;
case 'sc-disconnect':soundCloudDisconnect();break;
case 'sc-search':soundCloudSearch();break;
case 'sc-play':soundCloudPlay(Number(id));break;
case 'sc-search-youtube':if(youtubeSoundcloudSearch?.title)soundCloudSearch(youtubeSoundcloudSearch.title);break;
case 'playlist-save':savePlaylistLink();break;case 'playlist-open':{const p=linkedPlaylists[Number(id)];if(p){if(IS_ANDROID_MUSIC)window.GymTrackAndroid.openExternal(p.url);else window.open(p.url,'_blank','noopener');}break;}case 'playlist-remove':linkedPlaylists.splice(Number(id),1);localStorage.setItem('gymtrack_playlist_links',JSON.stringify(linkedPlaylists));render();break;
case 'native-pick':window.GymTrackAndroid.pickNativeAudio();break;case 'native-track':nativeMusicCommand('track',Number(id));break;case 'native-toggle':nativeMusicCommand('toggle');break;case 'native-next':nativeMusicCommand('next');break;case 'native-prev':nativeMusicCommand('previous');break;
case 'music-toggle':toggleMusic();break;case 'track-next':changeTrack(1);break;case 'track-prev':changeTrack(-1);break;case 'select-track':selectTrack(Number(id));break;
case 'export':exportData();break;case 'clear':clearData();break;case 'close-modal':closeModal();break;case 'backdrop':if(event.target===target)closeModal();break;
}});
document.addEventListener('change',event=>{const el=event.target;if(el.dataset.setField){updateSet(el.dataset.eid,el.dataset.sid,el.dataset.setField,el.value);return;}if(el.id==='planProgram'){selectedPlanProgram=el.value;return;}if(el.id==='techniqueGif'){techniqueUpload(el.files?.[0]);return;}if(el.id==='musicFiles'){addMusicFiles(el.files);return;}if(el.id==='importData'){importData(el.files?.[0]);return;}});
document.addEventListener('input',event=>{editorInputChanged(event.target);if(event.target.id==='musicSeek'&&Number.isFinite(music.audio.duration))music.audio.currentTime=music.audio.duration*(Number(event.target.value)/100);if(event.target.id==='musicVolume')music.audio.volume=Number(event.target.value)/100;});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeModal();if(event.key==='Enter'&&event.target.id==='customExercise'){event.preventDefault();addExercise();}});
document.addEventListener('dragover',event=>{const box=event.target.closest('#uploadBox');if(box){event.preventDefault();box.classList.add('dragging');}});
document.addEventListener('dragleave',event=>{const box=event.target.closest('#uploadBox');if(box)box.classList.remove('dragging');});
document.addEventListener('drop',event=>{const box=event.target.closest('#uploadBox');if(box){event.preventDefault();box.classList.remove('dragging');addMusicFiles(event.dataTransfer.files);}});
render();
if(scDesktopAvailable())refreshSoundCloudStatus();

document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');if(!a||!window.GymTrackAndroid)return;
  const href=a.getAttribute('href')||'';
  if(/^https?:\/\//i.test(href)){e.preventDefault();window.GymTrackAndroid.openExternal(href);}
});
</script>
